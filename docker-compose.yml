services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEXUSDB_AUTO_PERSIST: "true"
      NEXUSDB_PERSIST_DIR: /data
    volumes:
      - nexusdb-data:/data
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nexusdb-data:
